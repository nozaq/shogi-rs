on:
  push:
    branches:
      - main
  pull_request:

name: build

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        rust:
          - stable
          - nightly
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        run: |
          rustup update ${{ matrix.rust }}
          rustup default ${{ matrix.rust }}

      - run: cargo build

      - run: cargo test
